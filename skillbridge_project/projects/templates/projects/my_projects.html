{% extends "projects/base.html" %}
{% block content %}
<h1>Proyek Saya</h1>
<div class="grid">
{% for p in projects %}
  <div class="card">
    <h3><a href="{% url 'projects:detail' p.pk %}">{{ p.title }}</a></h3>
    <span class="badge">{{ p.get_status_display }}</span>
    <span class="badge">{{ p.get_project_type_display }}</span>
    <p>Deadline: {{ p.deadline|date:"d M Y" }}</p>
  </div>
{% empty %}
  <p>Kamu belum membuat proyek.</p>
{% endfor %}
</div>
{% endblock %}
